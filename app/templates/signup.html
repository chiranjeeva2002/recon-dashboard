<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up - Reconciliation Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center px-4">
  <div class="w-full max-w-sm rounded-xl border border-slate-200 bg-white p-8 shadow-sm">
    <h1 class="text-xl font-semibold mb-1">Create an account</h1>
    <p class="text-sm text-slate-500 mb-6">Reconciliation Dashboard</p>
    <form id="signup-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
        <input type="email" id="email" required class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:border-slate-500" placeholder="you@example.com" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <input type="password" id="password" required minlength="8" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:border-slate-500" placeholder="At least 8 characters" />
      </div>
      <p id="error" class="text-sm text-red-600 hidden"></p>
      <button type="submit" id="submit-btn" class="w-full rounded-md bg-slate-900 text-white py-2 text-sm font-medium hover:bg-slate-800 disabled:opacity-50">Sign up</button>
    </form>
    <p class="text-sm text-slate-500 text-center mt-4">
      Already have an account? <a href="/login" class="font-medium text-slate-900 underline">Sign in</a>
    </p>
  </div>

  <script>
    const form = document.getElementById("signup-form");
    const errorEl = document.getElementById("error");
    const btn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.classList.add("hidden");
      btn.disabled = true;
      btn.textContent = "Creating account...";
      try {
        const res = await fetch("/api/auth/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
          }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          errorEl.textContent = data.detail || "Something went wrong.";
          errorEl.classList.remove("hidden");
          btn.disabled = false;
          btn.textContent = "Sign up";
          return;
        }
        window.location.href = "/dashboard";
      } catch {
        errorEl.textContent = "Network error. Please try again.";
        errorEl.classList.remove("hidden");
        btn.disabled = false;
        btn.textContent = "Sign up";
      }
    });
  </script>
</body>
</html>
